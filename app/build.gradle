plugins {
    id 'com.android.application'
}

android {
    namespace 'com.afghanvoice.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'com.afghanvoice.admin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Release signing must be configured with a private keystore by the owner.
        }
    }
}
